[project]
name = "lead-engine"
version = "0.1.0"
description = "Indoko client-acquisition pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "google-auth>=2.30",
]

[project.scripts]
lead-engine = "lead_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
